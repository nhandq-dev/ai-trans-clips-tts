name: Build video-worker image

# The video worker is a standalone Python service that runs on the VPS alongside
# the TTS worker, so it ships as its own Docker image. Path-filtered so a change
# to app/ (TTS) does not rebuild it, and vice versa.
on:
  push:
    branches: [main]
    paths:
      - 'video-worker/**'
      - '.github/workflows/video-worker-image.yml'
  workflow_dispatch:

concurrency:
  group: video-worker-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/nhandq-dev/video-worker

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: video-worker
          file: video-worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
