[project]
name = "tts-worker"
version = "1.0.0"
description = "Standalone TTS worker: VieNeu for Vietnamese, edge-tts for other languages, ffmpeg for merging."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.12",
    "boto3>=1.34.0",
    "vieneu==3.3.0",
    "edge-tts>=7.2.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
